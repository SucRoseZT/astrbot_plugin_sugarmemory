desc: AstrBot 分层长期记忆：L2 事实 / L3 事件分层存储 + 写入门控（防记忆污染）+ system_prompt 隔离注入（防指令越权）+ 可解释记忆包与 Token 预算；阶段总结单次 LLM 调用产出摘要与断言，只认编号不建人；「一个人 = 一个 QQ + 一串称呼」，昵称/群名片/外号不再把同一个人拆成两个；召回三层（概念归一 / 问法别名 / 可选语义兜底）+ 先过滤后截断的候选池 / IDF 排序 / 近重复让位 / 最近几轮指代补位 + 冻结常驻包按话题触发增量刷新（省前缀缓存）+ 记忆生命周期（原文压主题词、90 天消亡）+ 可视化面板（记忆、人物、关系图、Token 用量）
